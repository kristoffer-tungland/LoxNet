version: '3.9'
services:
  loxnet-bridge:
    build: .
    image: loxnet-bridge:latest
    environment:
      - CONFIG=/data/config.yaml
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    depends_on:
      - mqtt
  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
